<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            padding: 8px;
            text-align: center;
            vertical-align: middle;
        }

        .numero {
            text-align: right;
        }

        .esquerda {
            text-align: left;
            vertical-align: top;
        }
        .direita {
text-align: right;
vertical-align: top;

}
.centro{
text-align: center;
vertical-align: top;

}
.topo{
text-align: center;
vertical-align: top;
}
    </style>
</head>

<body>
    <h1>Gabarito- Trabalhando com alinhamento</h1>

    <table>
        <tr>
            <td class="esquerda">A1 <br>(esquerda)</td>
            <td class="centro">B1 <br>(padrão centro)</td>
            <td class="direita">C1 <br>(direita)</td>
        </tr>
        <tr class="linha">
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>

        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>

    </table>
</body>

</html>
